const framePose=(f)=>{const cycles=Math.floor(f/9),rest=f%9;return cycles*9+(rest>=5?5:0)};

text('introtype','your',1.5);text('introtype','introducing',3.15);

function paint(t){const f=Math.min(599,Math.round(t*60+1e-5)),pf=framePose(f),q=pf/60;
 for(const r of renders)if(t>=r.start&&t<r.end)r.paint(Math.max(0,q-r.start));
 const state={...base};for(const u of updates)if(f>=u.frame)state[u.id]=u.s;for(const [id,s]of Object.entries(state))get(id).textContent=s;

 // Exponential stepped translations, never scaling, rotating or fading.

}
