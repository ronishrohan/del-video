      <script>
        (function () {
          const P = window.PROC, G = P.G, S = P.STEP, T = window.TYPE, D = window.DEL, H = P.hash;
          const c = (id) => document.getElementById(id);
          const LR = P.layer(c("a3-crust"), { w: 480, h: 270 });
          LR.draw = (t, ctx) => { ctx.font = '8px "Geist Mono", monospace'; ctx.textBaseline = "top"; const rows = 27, lh = 10, row = Math.round(rows * S.at(t, 8, 0.7)); for (let r = 0; r < rows; r++) { if (r > row) break; const v = r >= row - 1 ? 255 : 120; ctx.fillStyle = `rgb(${v},${v},${v})`; ctx.fillText(P.lineAt(71, r) + "  " + P.lineAt(72, r + 9), 6, r * lh + 2); } ctx.fillStyle = "#fff"; ctx.fillRect(0, Math.min(270, row * lh), 480, 1); };
          // GPU: rows switch on all at once in a travelling pattern; the word lands on "GPU" with a 2-frame flash
          const LG = P.layer(c("a3-cgpu"), { w: 960, h: 540 });
          LG.draw = (t, ctx) => { ctx.font = '12px "Geist Mono", monospace'; ctx.textBaseline = "top"; const lit = t >= 1.49; for (let r = 0; r < 30; r++) { const v = !lit ? 70 : Math.cos(t * 7 - r * 0.25) > 0 ? 255 : 110; ctx.fillStyle = `rgb(${v},${v},${v})`; ctx.fillText(P.lineAt(73, r) + "   " + P.lineAt(74, r + 3), 20, r * 18 + 6); } if (t >= 1.49 && t < 1.524) { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 960, 540); } };

          const LW = P.layer(c("a3-cwrap"), { w: 960, h: 540 });
          LW.draw = (t, ctx) => {
            const peel = S.at(t - 0.35, 7, 1.6);
            const box = { x: 180, y: 70, w: 600, h: 400 };

            const dens = 1;
            ctx.font = '13px "Geist Mono", monospace'; ctx.textBaseline = "top";
            for (let r = 0; r < 18; r++) { if (H(r, 1, 81) > dens && r < 17) continue; const g = Math.round(200 * (0.6 + 0.4 * H(r, 2, 81))); ctx.fillStyle = `rgb(${g},${g},${g})`; ctx.fillText(P.lineAt(81, r), box.x + 40, box.y + 70 + r * 18); }
            ctx.fillStyle = "#fff"; if (Math.floor(t * 2.2) % 2 === 0) ctx.fillRect(box.x + 40, box.y + 70 + 18 * 18, 8, 14);
            if (peel < 1) {

              parts.forEach((pt, i) => { for (let yy = 0; yy < pt[3]; yy += 2) { const sp = (0.4 + H(i, yy, 82)) * 1100 * peel, dir = H(i, yy + 1, 82) > 0.5 ? 1 : -1, g = i >= 8 ? 230 : 170; ctx.fillStyle = `rgb(${g},${g},${g})`; ctx.fillRect(pt[0] + dir * sp, pt[1] + yy, pt[2], Math.min(2, pt[3])); } });
              if (peel === 0) { ctx.fillStyle = "#000"; ctx.font = '10px "Geist Mono", monospace'; ctx.fillText("https://app.example.com/terminal", box.x + 8, box.y - 7); }
            }
          };
          const LL = P.layer(c("a3-cline"), { w: 960, h: 540 });
          LL.draw = (t, ctx) => { ctx.fillStyle = "#fff"; ctx.fillRect(170, 269, 620, 2); };
          // light by design: the clean, crisp window
          const S0 = D.DEFAULT_SESSIONS;
          c("a3-w").innerHTML = D.windowFrame(`<div class="col"><div class="thread"><div class="umsg">Profile the search worker</div><div class="amsg"><p>Peak memory is down from 412 MB to 198 MB on the benchmark.</p></div></div><div style="padding:0 0 16px">${D.composer({ id: "a3-c", provider: "claude", placeholder: "Ask for follow-up changes", folder: "~/dev/search-worker" })}</div></div>`, { id: "a3-win", sessions: S0.map((s, k) => Object.assign({}, s, { sel: k === 1 })) });

          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
