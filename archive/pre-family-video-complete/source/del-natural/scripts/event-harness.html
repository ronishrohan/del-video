  <body style="margin:0"><script>window.__timelines={};window.mountAct=async function(file){const html=await(await fetch(file)).text();const doc=new DOMParser().parseFromString(html,'text/html');const frag=doc.querySelector('template').content.cloneNode(true);const scripts=[...frag.querySelectorAll('script')];scripts.forEach(s=>s.remove());const host=document.createElement('div');host.style.cssText='position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden';host.appendChild(frag);document.body.appendChild(host);for(const s of scripts){const n=document.createElement('script');n.textContent=s.textContent;document.body.appendChild(n);}};</script></body></html>
