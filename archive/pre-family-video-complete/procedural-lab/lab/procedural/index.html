<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Del · procedural lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#0b0c0e; --fg:#cfd3d9; --dim:#6d727a; --line:#222428; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { padding:22px 24px 6px; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; }
  h1 { font-size:13px; margin:0; font-weight:600; letter-spacing:.02em; }
  header p { margin:0; color:var(--dim); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); gap:18px; padding:16px 24px 48px; }
  .tile { border:1px solid var(--line); background:#000; }
  .tile canvas { display:block; width:100%; aspect-ratio:16/9; image-rendering:pixelated; cursor:zoom-in; }
  .meta { padding:9px 11px 10px; border-top:1px solid var(--line); }
  .name { font-weight:600; }
  .name b { color:var(--dim); font-weight:400; margin-right:6px; }
  .tech, .beat { color:var(--dim); }
  .beat::before { content:"beat  "; color:#4b5058; }
  .ctl { display:flex; gap:12px; align-items:center; margin-top:8px; color:var(--dim); }
  .ctl input, .ctl button { font:inherit; color:var(--fg); background:#131417; border:1px solid var(--line); padding:2px 6px; }
  .ctl input[type=number] { width:70px; }
  .ctl input[type=range] { width:90px; padding:0; accent-color:#9fb0c4; }
  .ctl button { cursor:pointer; }
  #fs { position:fixed; inset:0; background:#000; display:none; align-items:center; justify-content:center; }
  #fs.on { display:flex; }
  #fs canvas { width:min(100vw,177.78vh); height:min(56.25vw,100vh); image-rendering:pixelated; }
  #hud { position:fixed; left:12px; top:10px; padding:4px 8px; background:#000; color:#cfd3d9; border:1px solid #2a2c30; white-space:pre; }
  #hint { position:fixed; right:12px; bottom:10px; padding:4px 8px; background:#000; color:#6d727a; border:1px solid #2a2c30; }
</style>
</head>
<body>
<header>
  <h1>Del · procedural lab</h1>
  <p>Live, deterministic f(time, seed). Hard cuts, snaps, translation only. Click a tile for fullscreen 16:9, Esc to return.</p>
</header>
<div id="grid"></div>
<div id="fs"><canvas id="fsc"></canvas><div id="hud"></div><div id="hint">esc back · space pause · ←/→ step 1 frame · [ ] seed</div></div>
<script>
'use strict';
const LAB = window.LAB = { vars: [], register(v) { this.vars.push(v); addTile(v); } };

// ---------- deterministic helpers (port 1:1) ----------
LAB.rng = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
LAB.hash = (a, b = 0, c = 0) => { let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul(c | 0, 0x9e3779b1); h ^= h >>> 15; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
LAB.noise = (x, y, s = 0) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const h = LAB.hash; const a = h(xi, yi, s), b = h(xi + 1, yi, s), c = h(xi, yi + 1, s), d = h(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
LAB.BAYER8 = (() => { const m = [0, 2, 3, 1], out = new Float32Array(64); for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { let v = 0; for (let b = 0; b < 3; b++) v = v * 4 + m[(((x >> (2 - b)) & 1)) + (((y >> (2 - b)) & 1) << 1)]; out[y * 8 + x] = (v + 0.5) / 64; } return out; })();
LAB.THEMES = {
  dark:  { bg: [11, 12, 14],   fg: [214, 218, 224], ac: [150, 176, 204] },
  paper: { bg: [233, 230, 223], fg: [20, 21, 24],   ac: [62, 92, 130] },
};
LAB.CODEX = [86, 148, 255]; LAB.CLAUDE = [232, 124, 64];
LAB.css = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
LAB.FONT = 'ui-monospace,SFMono-Regular,Menlo,monospace';
// glyph atlas: one row of chars, colored, cached per (chars, color, cell size)
const atlasCache = new Map();
LAB.atlas = (chars, color, cw, ch) => {
  const key = chars + '|' + color + '|' + cw + 'x' + ch;
  let a = atlasCache.get(key); if (a) return a;
  const c = document.createElement('canvas'); c.width = cw * chars.length; c.height = ch;
  const x = c.getContext('2d'); x.fillStyle = color; x.textBaseline = 'middle'; x.textAlign = 'center';
  x.font = `${Math.round(ch * 0.86)}px ${LAB.FONT}`;
  for (let i = 0; i < chars.length; i++) x.fillText(chars[i], i * cw + cw / 2, ch / 2 + 0.5);
  a = { canvas: c, cw, ch, key: color, index: new Map([...chars].map((k, i) => [k, i])) };
  if (atlasCache.size > 200) atlasCache.clear();
  atlasCache.set(key, a); return a;
};
// draw a string with an atlas at cell coords (no per-frame fillText)
LAB.text = (ctx, a, str, x, y) => { for (let i = 0; i < str.length; i++) { const k = a.index.get(str[i]); if (k !== undefined && str[i] !== ' ') ctx.drawImage(a.canvas, k * a.cw, 0, a.cw, a.ch, x + i * a.cw, y, a.cw, a.ch); } };
// whole-line bitmap cache: one drawImage per row for scrolling text (lines are pure functions of their index)
const lineCache = new Map();
LAB.line = (ctx, a, str, x, y) => {
  if (!str) return;
  const key = a.canvas.width + '|' + a.ch + '|' + a.key + '|' + str;
  let c = lineCache.get(key);
  if (!c) {
    if (lineCache.size > 4000) lineCache.clear();
    c = document.createElement('canvas'); c.width = Math.max(1, str.length * a.cw); c.height = a.ch;
    LAB.text(c.getContext('2d'), a, str, 0, 0); lineCache.set(key, c);
  }
  ctx.drawImage(c, x, y);
};

// ---------- shared WebGL (one context for all shader tiles) ----------
const glc = document.createElement('canvas');
const gl = glc.getContext('webgl', { preserveDrawingBuffer: true, antialias: false, alpha: false });
const PRELUDE = `precision highp float;
uniform vec2 uRes; uniform float uTime, uSeed; uniform vec3 uBg, uFg, uAc;
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21) + uSeed*0.013); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*noise(p); p=p*2.03+17.1; a*=.5; } return s; }
float bayer2(vec2 a){ a=floor(a); return fract(a.x/2. + a.y*a.y*.75); }
float bayer4(vec2 a){ return bayer2(.5*a)*.25 + bayer2(a); }
float bayer8(vec2 a){ return bayer4(.5*a)*.25 + bayer2(a); }
vec3 ink(float on){ return on > .5 ? uFg : uBg; }
`;
const VERT = 'attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }';
function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function program(v) {
  if (v._prog) return v._prog;
  const p = gl.createProgram(); gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, PRELUDE + v.frag)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; for (const n of ['uRes', 'uTime', 'uSeed', 'uBg', 'uFg', 'uAc', 'uP']) u[n] = gl.getUniformLocation(p, n);
  return (v._prog = { p, u });
}
const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
function renderGL(v, ctx, W, H, t, seed, th) {
  if (glc.width !== W || glc.height !== H) { glc.width = W; glc.height = H; }
  const { p, u } = program(v); gl.viewport(0, 0, W, H); gl.useProgram(p);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(u.uRes, W, H); gl.uniform1f(u.uTime, t); gl.uniform1f(u.uSeed, seed);
  const c = (k) => gl.uniform3f(u[k], th[k.slice(1).toLowerCase()][0] / 255, th[k.slice(1).toLowerCase()][1] / 255, th[k.slice(1).toLowerCase()][2] / 255);
  c('uBg'); c('uFg'); c('uAc');
  if (u.uP && v.params) gl.uniform4fv(u.uP, v.params(t, seed));
  gl.drawArrays(gl.TRIANGLES, 0, 3); ctx.drawImage(glc, 0, 0);
}

// ---------- tiles ----------
const grid = document.getElementById('grid'), fs = document.getElementById('fs'), fsc = document.getElementById('fsc'), hud = document.getElementById('hud');
const tiles = []; let fsTile = null, paused = false;
const fsCtx = fsc.getContext('2d', { alpha: false });
function addTile(v) {
  const n = tiles.length + 1, el = document.createElement('div'); el.className = 'tile';
  el.innerHTML = `<canvas></canvas><div class="meta"><div class="name"><b>${String(n).padStart(2, '0')}</b>${v.name}</div>
    <div class="tech">${v.tech}</div><div class="beat">${v.beat}</div>
    <div class="ctl">seed <input type="number" class="seed" value="${v.seed ?? 1}" step="1">
    speed <input type="range" class="speed" min="0" max="3" step="0.25" value="1"><span class="sv">1.00x</span>
    <button class="theme">paper</button></div></div>`;
  grid.appendChild(el);
  const T = { v, el, canvas: el.querySelector('canvas'), t: 0, seed: v.seed ?? 1, speed: 1, theme: 'dark', visible: true, S: {}, FS: {} };
  T.ctx = T.canvas.getContext('2d', { alpha: false });
  el.querySelector('.seed').oninput = (e) => { T.seed = parseInt(e.target.value, 10) || 0; T.S = {}; T.FS = {}; };
  el.querySelector('.speed').oninput = (e) => { T.speed = +e.target.value; el.querySelector('.sv').textContent = T.speed.toFixed(2) + 'x'; };
  el.querySelector('.theme').onclick = (e) => { T.theme = T.theme === 'dark' ? 'paper' : 'dark'; e.target.textContent = T.theme === 'dark' ? 'paper' : 'graphite'; };
  T.canvas.onclick = () => { fsTile = T; T.FS = {}; fs.classList.add('on'); };
  io.observe(T.canvas); T.canvas._T = T; tiles.push(T);
  // deep link: index.html?t=3.5&pause&seed=9#06 opens tile 06 fullscreen at t=3.5 s
  if (location.hash === '#' + String(n).padStart(2, '0')) {
    const q = new URLSearchParams(location.search);
    if (q.has('t')) T.t = +q.get('t'); if (q.has('seed')) setSeed(T, +q.get('seed')); if (q.has('pause')) paused = true;
    if (q.get('theme') === 'paper') el.querySelector('.theme').onclick({ target: el.querySelector('.theme') });
    T.canvas.onclick();
  }
}
const io = new IntersectionObserver((es) => { for (const e of es) e.target._T.visible = e.isIntersecting; });
function setSeed(T, s) { T.seed = s; T.S = {}; T.FS = {}; T.el.querySelector('.seed').value = s; }
addEventListener('keydown', (e) => {
  if (!fsTile) return;
  if (e.key === 'Escape') { fsTile = null; fs.classList.remove('on'); paused = false; history.replaceState(null, '', location.pathname); }
  else if (e.key === ' ') { paused = !paused; e.preventDefault(); }
  else if (e.key === 'ArrowRight') { fsTile.t += 1 / 60; }
  else if (e.key === 'ArrowLeft') { fsTile.t = Math.max(0, fsTile.t - 1 / 60); }
  else if (e.key === ']') setSeed(fsTile, fsTile.seed + 1);
  else if (e.key === '[') setSeed(fsTile, fsTile.seed - 1);
});

function draw(T, canvas, ctx, S, full) {
  const dpr = devicePixelRatio || 1, px = T.v.px || 2, maxW = full ? (T.v.maxW || 1280) : 960;
  const W = Math.max(64, Math.min(maxW, Math.round(canvas.clientWidth * dpr / px))), H = Math.round(W * 9 / 16);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; for (const k in S) delete S[k]; }
  const th = LAB.THEMES[T.theme];
  try {
    if (T.v.frag) renderGL(T.v, ctx, W, H, T.t, T.seed, th);
    else T.v.draw(ctx, W, H, T.t, T.seed, th, S);
  } catch (err) { if (!T.err) { T.err = 1; console.error(T.v.name, err); } }
}

let last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; document.title = fsTile ? `${fps.toFixed(0)} fps · ${fsTile.v.name}` : `Del · procedural lab · ${fps.toFixed(0)} fps`; }
  if (fsTile) {
    if (!paused) fsTile.t += dt * fsTile.speed;
    draw(fsTile, fsc, fsCtx, fsTile.FS, true);
    hud.textContent = `${fsTile.v.name}\n${fps.toFixed(1)} fps   t ${fsTile.t.toFixed(3)}s   seed ${fsTile.seed}   ${fsc.width}x${fsc.height}${paused ? '   PAUSED' : ''}`;
  } else {
    for (const T of tiles) { T.t += dt * T.speed; if (T.visible) draw(T, T.canvas, T.ctx, T.S, false); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- variations: one file each, loaded in order; missing files are skipped ----------
const FILES = ['_term', 'bayer-flow', 'atkinson-gradient', 'halftone-field', 'ascii-shade', 'terminal-streams', 'mux-split',
  'tab-multiply', 'oscilloscope', 'pixel-sort', 'cell-growth', 'logo-bars', 'search-hit', 'butter-glide', 'giant-type'];
const BUST = Date.now(); // lab is edited live; never serve stale variation files
// ?bench: time each variation's fullscreen draw (ms/frame, synchronous incl. GL readback) into <pre id="bench">
function bench() {
  fs.classList.add('on'); const out = [];
  for (const T of tiles) {
    // determinism: frame at t=2.5 from fresh state must equal the same frame after other frames ran
    const sum = () => { const d = fsCtx.getImageData(0, 0, fsc.width, fsc.height).data; let h = 0; for (let i = 0; i < d.length; i += 4) h = (Math.imul(h, 31) + d[i] + d[i + 1] * 3 + d[i + 2] * 7) | 0; return h; };
    fsTile = T; T.FS = {}; T.t = 2.5; draw(T, fsc, fsCtx, T.FS, true); const h0 = sum();
    const N = 40, t0 = performance.now();
    for (let i = 0; i < N; i++) { T.t = 1 + i / 60; draw(T, fsc, fsCtx, T.FS, true); }
    fsCtx.getImageData(0, 0, 1, 1);
    const ms = (performance.now() - t0) / N;
    T.t = 2.5; draw(T, fsc, fsCtx, T.FS, true); const det = sum() === h0 ? 'det ok ' : 'det FAIL';
    out.push(`${ms.toFixed(2).padStart(7)} ms  ${det}  ${fsc.width}x${fsc.height}  ${T.v.name}`);
  }
  fsTile = null; fs.classList.remove('on');
  const pre = document.createElement('pre'); pre.id = 'bench'; pre.textContent = out.join('\n'); document.body.prepend(pre);
}
(function load(i) {
  if (i >= FILES.length) { if (new URLSearchParams(location.search).has('bench')) bench(); return; }
  const s = document.createElement('script'); s.src = `v/${FILES[i]}.js?b=${BUST}`;
  s.onload = s.onerror = () => load(i + 1); document.head.appendChild(s);
})(0);
</script>
</body>
</html>
